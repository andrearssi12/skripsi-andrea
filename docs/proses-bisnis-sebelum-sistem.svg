<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Proses bisnis sebelum adanya sistem Web GIS</title>
  <desc id="desc">Diagram alur proses manual pemetaan kawasan hijau kampus.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .issue-title { font: 700 18px Arial, sans-serif; fill: #991b1b; }
      .issue-text { font: 400 15px Arial, sans-serif; fill: #7f1d1d; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="65" class="title">Proses Bisnis Sebelum Adanya Sistem</text>
  <text x="70" y="95" class="subtitle">Pemetaan dan pemantauan kawasan hijau dilakukan secara manual dan terpisah.</text>

  <rect x="70" y="130" width="1260" height="570" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="70" y="130" width="250" height="570" rx="12" fill="#64748b"/>
  <rect x="70" y="130" width="250" height="570" rx="12" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="195" y="165" text-anchor="middle" class="lane-title">Pelaku</text>
  <text x="195" y="295" text-anchor="middle" class="lane-title">Pengumpulan Data</text>
  <text x="195" y="425" text-anchor="middle" class="lane-title">Pengolahan Data</text>
  <text x="195" y="555" text-anchor="middle" class="lane-title">Hasil dan Keputusan</text>
  <line x1="70" y1="200" x2="1330" y2="200" stroke="#cbd5e1"/>
  <line x1="70" y1="330" x2="1330" y2="330" stroke="#cbd5e1"/>
  <line x1="70" y1="460" x2="1330" y2="460" stroke="#cbd5e1"/>
  <line x1="70" y1="590" x2="1330" y2="590" stroke="#cbd5e1"/>

  <g filter="url(#shadow)">
    <rect x="370" y="230" width="220" height="105" rx="8" fill="#e2e8f0"/>
    <text x="480" y="263" text-anchor="middle" class="box-title">Admin / Pengelola</text>
    <text x="480" y="289" text-anchor="middle" class="box-text">Mengumpulkan data</text>
    <text x="480" y="311" text-anchor="middle" class="box-text">kampus dan kawasan hijau</text>

    <rect x="650" y="230" width="220" height="105" rx="8" fill="#e2e8f0"/>
    <text x="760" y="263" text-anchor="middle" class="box-title">Survei Lapangan</text>
    <text x="760" y="289" text-anchor="middle" class="box-text">Mengamati lokasi, luas,</text>
    <text x="760" y="311" text-anchor="middle" class="box-text">dan kondisi objek</text>

    <rect x="930" y="230" width="220" height="105" rx="8" fill="#e2e8f0"/>
    <text x="1040" y="263" text-anchor="middle" class="box-title">Catatan Terpisah</text>
    <text x="1040" y="289" text-anchor="middle" class="box-text">Formulir, foto,</text>
    <text x="1040" y="311" text-anchor="middle" class="box-text">spreadsheet, atau dokumen</text>

    <rect x="510" y="360" width="220" height="105" rx="8" fill="#dbeafe"/>
    <text x="620" y="393" text-anchor="middle" class="box-title">Pengolahan Manual</text>
    <text x="620" y="419" text-anchor="middle" class="box-text">Menggambar atau memperbarui</text>
    <text x="620" y="441" text-anchor="middle" class="box-text">peta secara terpisah</text>

    <rect x="790" y="360" width="220" height="105" rx="8" fill="#dbeafe"/>
    <text x="900" y="393" text-anchor="middle" class="box-title">Perhitungan Manual</text>
    <text x="900" y="419" text-anchor="middle" class="box-text">Menjumlahkan luas dan</text>
    <text x="900" y="441" text-anchor="middle" class="box-text">menghitung persentase</text>

    <rect x="650" y="490" width="220" height="105" rx="8" fill="#fef3c7"/>
    <text x="760" y="523" text-anchor="middle" class="box-title">Laporan / Peta</text>
    <text x="760" y="549" text-anchor="middle" class="box-text">Disusun ketika diperlukan</text>
    <text x="760" y="571" text-anchor="middle" class="box-text">untuk evaluasi</text>

    <rect x="930" y="490" width="220" height="105" rx="8" fill="#fef3c7"/>
    <text x="1040" y="523" text-anchor="middle" class="box-title">Pengambilan Keputusan</text>
    <text x="1040" y="549" text-anchor="middle" class="box-text">Menentukan pemeliharaan</text>
    <text x="1040" y="571" text-anchor="middle" class="box-text">atau pengembangan area</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M590 282 H650"/>
    <path d="M870 282 H930"/>
    <path d="M1040 335 V385 H730"/>
    <path d="M730 412 H790"/>
    <path d="M900 465 V490 H870"/>
    <path d="M870 542 H930"/>
  </g>

  <rect x="70" y="750" width="1260" height="100" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
  <text x="100" y="785" class="issue-title">Kendala proses:</text>
  <text x="100" y="814" class="issue-text">Data tersebar, pembaruan lambat, sulit melihat lokasi secara terpadu, perhitungan rawan kesalahan, dan laporan kondisi tidak terdokumentasi secara terpusat.</text>
</svg>