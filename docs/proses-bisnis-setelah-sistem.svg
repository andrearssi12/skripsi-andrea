<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Proses bisnis setelah adanya sistem Web GIS</title>
  <desc id="desc">Diagram alur proses terintegrasi Web GIS untuk pemetaan kawasan hijau kampus.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #0f766e; }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#f0fdfa"/>
  <text x="70" y="65" class="title">Proses Bisnis Setelah Adanya Sistem Web GIS</text>
  <text x="70" y="95" class="subtitle">Data spasial, analisis kawasan hijau, feedback, dan rencana pengembangan terhubung dalam satu sistem.</text>

  <rect x="70" y="130" width="1260" height="690" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <rect x="70" y="130" width="250" height="690" rx="12" fill="#0f766e"/>
  <rect x="70" y="130" width="250" height="690" rx="12" fill="none" stroke="#115e59" stroke-width="2"/>
  <text x="195" y="165" text-anchor="middle" class="lane-title">Aktor dan Proses</text>
  <text x="195" y="290" text-anchor="middle" class="lane-title">Input Data</text>
  <text x="195" y="430" text-anchor="middle" class="lane-title">Pengolahan Sistem</text>
  <text x="195" y="570" text-anchor="middle" class="lane-title">Informasi</text>
  <text x="195" y="710" text-anchor="middle" class="lane-title">Tindak Lanjut</text>
  <line x1="70" y1="200" x2="1330" y2="200" stroke="#99f6e4"/>
  <line x1="70" y1="340" x2="1330" y2="340" stroke="#99f6e4"/>
  <line x1="70" y1="490" x2="1330" y2="490" stroke="#99f6e4"/>
  <line x1="70" y1="630" x2="1330" y2="630" stroke="#99f6e4"/>
  <line x1="70" y1="770" x2="1330" y2="770" stroke="#99f6e4"/>

  <g filter="url(#shadow)">
    <rect x="370" y="225" width="205" height="95" rx="8" fill="#ccfbf1"/>
    <text x="472" y="255" text-anchor="middle" class="box-title">Admin</text>
    <text x="472" y="280" text-anchor="middle" class="box-text">Mengelola kampus, kategori,</text>
    <text x="472" y="301" text-anchor="middle" class="box-text">dan data spasial</text>

    <rect x="610" y="225" width="205" height="95" rx="8" fill="#ccfbf1"/>
    <text x="712" y="255" text-anchor="middle" class="box-title">Import GeoJSON</text>
    <text x="712" y="280" text-anchor="middle" class="box-text">Data polygon hasil digitasi</text>
    <text x="712" y="301" text-anchor="middle" class="box-text">QGIS dimasukkan ke sistem</text>

    <rect x="850" y="225" width="205" height="95" rx="8" fill="#ccfbf1"/>
    <text x="952" y="255" text-anchor="middle" class="box-title">Civitas Academica</text>
    <text x="952" y="280" text-anchor="middle" class="box-text">Mengirim feedback dan</text>
    <text x="952" y="301" text-anchor="middle" class="box-text">foto kondisi kawasan</text>

    <rect x="1090" y="225" width="205" height="95" rx="8" fill="#ccfbf1"/>
    <text x="1192" y="255" text-anchor="middle" class="box-title">Pengurus Lingkungan</text>
    <text x="1192" y="280" text-anchor="middle" class="box-text">Memantau dan menindaklanjuti</text>
    <text x="1192" y="301" text-anchor="middle" class="box-text">laporan pengguna</text>

    <rect x="490" y="370" width="230" height="100" rx="8" fill="#dbeafe"/>
    <text x="605" y="402" text-anchor="middle" class="box-title">Validasi dan Penyimpanan</text>
    <text x="605" y="428" text-anchor="middle" class="box-text">Validasi geometry, luas,</text>
    <text x="605" y="450" text-anchor="middle" class="box-text">atribut, dan batas kampus</text>

    <rect x="780" y="370" width="230" height="100" rx="8" fill="#dbeafe"/>
    <text x="895" y="402" text-anchor="middle" class="box-title">Database Terpusat</text>
    <text x="895" y="428" text-anchor="middle" class="box-text">Kampus, land use, feedback,</text>
    <text x="895" y="450" text-anchor="middle" class="box-text">rencana, dan activity log</text>

    <rect x="1070" y="370" width="190" height="100" rx="8" fill="#dbeafe"/>
    <text x="1165" y="402" text-anchor="middle" class="box-title">Analisis Otomatis</text>
    <text x="1165" y="428" text-anchor="middle" class="box-text">Luas, persentase, target</text>
    <text x="1165" y="450" text-anchor="middle" class="box-text">30%, dan rekomendasi</text>

    <rect x="410" y="520" width="220" height="95" rx="8" fill="#ecfccb"/>
    <text x="520" y="550" text-anchor="middle" class="box-title">Peta Interaktif</text>
    <text x="520" y="576" text-anchor="middle" class="box-text">Layer kampus, polygon, popup,</text>
    <text x="520" y="597" text-anchor="middle" class="box-text">legenda, dan detail objek</text>

    <rect x="680" y="520" width="220" height="95" rx="8" fill="#ecfccb"/>
    <text x="790" y="550" text-anchor="middle" class="box-title">Dashboard Analisis</text>
    <text x="790" y="576" text-anchor="middle" class="box-text">Green Area, Vegetasi Non-RTH,</text>
    <text x="790" y="597" text-anchor="middle" class="box-text">gap, dan status target</text>

    <rect x="950" y="520" width="220" height="95" rx="8" fill="#ecfccb"/>
    <text x="1060" y="550" text-anchor="middle" class="box-title">Feedback Terpantau</text>
    <text x="1060" y="576" text-anchor="middle" class="box-text">Status Menunggu, Diproses,</text>
    <text x="1060" y="597" text-anchor="middle" class="box-text">atau Selesai</text>

    <rect x="570" y="660" width="240" height="100" rx="8" fill="#fef3c7"/>
    <text x="690" y="692" text-anchor="middle" class="box-title">Rekomendasi dan Rencana</text>
    <text x="690" y="718" text-anchor="middle" class="box-text">Konservasi, revitalisasi,</text>
    <text x="690" y="740" text-anchor="middle" class="box-text">konversi RTH, dan koridor hijau</text>

    <rect x="860" y="660" width="240" height="100" rx="8" fill="#fef3c7"/>
    <text x="980" y="692" text-anchor="middle" class="box-title">Persetujuan Admin</text>
    <text x="980" y="718" text-anchor="middle" class="box-text">Rencana disetujui dan</text>
    <text x="980" y="740" text-anchor="middle" class="box-text">ditampilkan pada peta</text>
  </g>

  <g stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M575 272 H610"/>
    <path d="M815 272 H850"/>
    <path d="M1055 272 H1090"/>
    <path d="M712 320 V350 H605 V370"/>
    <path d="M605 470 H780"/>
    <path d="M895 470 V500 H520 V520"/>
    <path d="M895 470 V520"/>
    <path d="M1165 470 V520"/>
    <path d="M790 615 V660"/>
    <path d="M810 710 H860"/>
  </g>

  <rect x="70" y="855" width="1260" height="80" rx="10" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
  <text x="100" y="888" class="box-title">Manfaat proses:</text>
  <text x="100" y="914" class="small">Data terpusat, informasi spasial mudah diakses, analisis lebih cepat, feedback terlacak, dan keputusan pengembangan didukung data.</text>
</svg>